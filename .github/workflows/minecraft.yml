name: Minecraft plugin

# Builds the Medieval Paper plugin from a clean checkout. Nothing here depends on a running
# Minecraft server, a database or any local tooling: it only compiles, tests and packages.

on:
  push:
    paths:
      - "minecraft/**"
      - ".github/workflows/minecraft.yml"
  pull_request:
    paths:
      - "minecraft/**"
      - ".github/workflows/minecraft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Java 25 / Paper 26.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: minecraft

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: minecraft

      - name: Build and run tests
        run: ./gradlew build --stacktrace
        working-directory: minecraft

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: medieval-plugin
          path: minecraft/medieval-paper/build/libs/Medieval-*.jar
          if-no-files-found: error
