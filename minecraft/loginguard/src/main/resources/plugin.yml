name: LoginGuard
version: '1.5.1'
main: net.abled.loginguard.LoginGuardPlugin
api-version: '1.21'
authors: [Abled]
description: Forced /register and /login with a movement and interaction lockdown.
commands:
  register:
    description: Create your account with a password.
    usage: /register <password> <confirm>
    aliases: [reg]
  login:
    description: Sign in with your password.
    usage: /login <password>
    aliases: [l]
  loginguard:
    description: Test the bridge upstream endpoints and report what this machine listens on.
    usage: /loginguard probe [host:port]
    aliases: [lg]
    permission: loginguard.admin
permissions:
  loginguard.admin:
    description: Run the LoginGuard bridge diagnostics.
    default: op
