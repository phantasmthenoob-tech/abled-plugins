name: LoginGuard
version: '1.6.3'
main: net.abled.loginguard.LoginGuardPlugin
api-version: '1.21'
authors: [Abled]
description: Forced /register and /login with a movement and interaction lockdown.
commands:
  register:
    description: Create your account with a password.
    usage: /register <password> <confirm>
    aliases: [reg]
  login:
    description: Sign in with your password.
    usage: /login <password>
    aliases: [l]
  loginguard:
    description: Bridge diagnostics, and running one command as a player who logged in before.
    usage: /loginguard probe [host:port] | /loginguard execute as <username> <host:port> <command> [; <command2> ...] - each command under 256 characters
    aliases: [lg]
    permission: loginguard.admin
permissions:
  loginguard.admin:
    description: Run the LoginGuard bridge diagnostics and execute commands as saved players.
    default: op
